<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INIADの紹介</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #102a43;
        --blue: #176b87;
        --mint: #d9f0e9;
        --ink: #243b53;
        --muted: #526579;
        --paper: #ffffff;
        --background: #f2f7f8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 48px 20px;
        color: var(--ink);
        background: linear-gradient(145deg, #e8f4f3 0%, var(--background) 48%, #edf2fa 100%);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        line-height: 1.9;
      }

      main {
        width: min(100%, 840px);
        margin: 0 auto;
        padding: clamp(28px, 6vw, 64px);
        background: var(--paper);
        border: 1px solid rgba(16, 42, 67, 0.06);
        border-radius: 20px;
        box-shadow: 0 18px 50px rgba(16, 42, 67, 0.1);
      }

      h1 {
        margin: 0 0 40px;
        padding: 0 0 22px;
        color: var(--navy);
        border-bottom: 3px solid var(--mint);
        font-size: clamp(2rem, 5vw, 2.8rem);
        letter-spacing: 0.06em;
        line-height: 1.35;
      }

      h1::before {
        display: block;
        margin-bottom: 12px;
        color: var(--blue);
        content: "TOYO UNIVERSITY · INFORMATION NETWORKING";
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      h2 {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 36px 0 14px;
        color: var(--navy);
        font-size: 1.35rem;
      }

      h2::before {
        width: 5px;
        height: 1.35em;
        border-radius: 5px;
        background: var(--blue);
        content: "";
      }

      p { margin: 0; color: var(--muted); }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        padding: 14px 16px 14px 42px;
        color: var(--navy);
        background: #f3f8f8;
        border: 1px solid #e3eeee;
        border-radius: 10px;
        font-weight: 600;
        transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
      }

      li::before {
        position: absolute;
        left: 17px;
        color: var(--blue);
        content: "✦";
      }

      li:hover {
        transform: translateY(-2px);
        background: var(--mint);
        box-shadow: 0 6px 16px rgba(16, 42, 67, 0.08);
      }

      @media (max-width: 520px) {
        body { padding: 20px 12px; }
        main { padding: 28px 22px; border-radius: 14px; }
        h1 { margin-bottom: 30px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>INIADの紹介</h1>
      <section aria-labelledby="overview">
        <h2 id="overview">概要</h2>
        <p>INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。さらに、ソースプログラム管理システム「Git」を用いた開発や、情報通信技術に関する幅広い知識を身につけます。実践的な学びを通じて、これからの社会を支える人材を育成します。</p>
      </section>
      <section aria-labelledby="curriculum">
        <h2 id="curriculum">科目群一覧</h2>
        <ul>
          <li>コンピュータ・システム</li>
          <li>コンピュータ・ソフトウェア</li>
          <li>ユーザ・エクスペリエンス</li>
          <li>データサイエンス</li>
          <li>ICT社会応用</li>
          <li>連携科目群</li>
          <li>ビジネス構築</li>
          <li>コミュニティ形成</li>
        </ul>
      </section>
    </main>
  </body>
</html>
